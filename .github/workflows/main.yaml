name: main

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read    


jobs:
  deploy-static-site-uat:
    uses: ./.github/workflows/deploy-static-site-to-s3.yaml
    with:
      aws_iam_role: arn:aws:iam::722264665990:role/uat-metamask-deeplink-signer-github-actions
      aws_region: us-east-1
      s3_bucket: signer.link-test.metamask.consensys.io
      s3_prefix: /
      environment: uat

  deploy-static-site-prd:
    uses: ./.github/workflows/deploy-static-site-to-s3.yaml
    needs: [ deploy-static-site-uat ]
    with:
      aws_iam_role: arn:aws:iam::363762752069:role/prd-metamask-deeplink-signer-github-actions
      aws_region: us-east-1
      s3_bucket: signer.link.metamask.consensys.io
      s3_prefix: /
      environment: prd
